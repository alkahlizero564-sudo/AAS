name: Build AAS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  APP_NAME: AAS

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name aas --org com.aas .
          fi
          rm -rf test

      - name: Patch android (permissions, name, minSdk)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application#' "$M"
          fi
          sed -i -E "s#android:label=\"[^\"]*\"#android:label=\"$APP_NAME\"#" "$M"
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 23/' "$f"
            fi
          done

      - run: flutter pub get

      - name: Build (مع مرايا بديلة للتحميل)
        run: |
          set -o pipefail
          P=android/gradle/wrapper/gradle-wrapper.properties

          use_gradle_mirror() {
            [ -f "$P" ] || return 0
            grep -q mirrors "$P" && return 0
            VER=$(grep -oE 'gradle-[0-9][0-9.]*' "$P" | head -1 | sed 's/^gradle-//; s/\.$//')
            for M in "https://mirrors.cloud.tencent.com/gradle" "https://mirrors.aliyun.com/gradle"; do
              if curl -fsIL --max-time 25 "$M/gradle-$VER-bin.zip" > /dev/null; then
                sed -i '/^distributionSha256Sum/d' "$P"
                sed -i "s#^distributionUrl=.*#distributionUrl=$M/gradle-$VER-bin.zip#" "$P"
                echo "Gradle mirror: $M (version $VER)"
                return 0
              fi
            done
            echo "no gradle mirror available"
            return 0
          }

          use_maven_mirror() {
            mkdir -p "$HOME/.gradle/init.d"
            cat > "$HOME/.gradle/init.d/mirror.gradle" <<'EOF'
          def mirrors = [
            'https://maven.aliyun.com/repository/public',
            'https://maven.aliyun.com/repository/google',
            'https://maven.aliyun.com/repository/gradle-plugin',
            'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
          ]
          allprojects {
            buildscript {
              repositories { mirrors.each { u -> maven { url u } } }
            }
            repositories { mirrors.each { u -> maven { url u } } }
          }
          beforeSettings { settings ->
            settings.pluginManagement {
              repositories { mirrors.each { u -> maven { url u } } }
            }
          }
          EOF
            echo "Maven mirrors enabled"
          }

          for i in 1 2 3 4 5; do
            if flutter build apk --release 2>&1 | tee build.log; then
              exit 0
            fi
            if ! grep -qE 'HTTP response code|status code 5[0-9][0-9]|Gateway Time-out|Could not (resolve|download|get)|timed out|Connection reset' build.log; then
              echo "فشل ليس بسبب الشبكة. لا إعادة محاولة."
              exit 1
            fi
            echo "المحاولة $i فشلت بسبب الشبكة."
            use_gradle_mirror
            use_maven_mirror
            sleep 15
          done
          exit 1

      - name: Rename apk
        run: cp build/app/outputs/flutter-apk/app-release.apk "$APP_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: ${{ env.APP_NAME }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.APP_NAME }} build ${{ github.run_number }}
          files: ${{ env.APP_NAME }}.apk
